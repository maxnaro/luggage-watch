name: Build LaTeX PDF

on:
  pull_request:
    paths:
      - "**/*.tex"
      - "**/*.puml"
      - "**/*.bib"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz plantuml

      - name: Generate PlantUML Diagrams
        run: |
          set -euo pipefail
          shopt -s nullglob
          puml_files=(*.puml)
          if [ ${#puml_files[@]} -eq 0 ]; then
            echo "Error: No PlantUML (*.puml) files found in $(pwd)." >&2
            exit 1
          fi
          echo "Generating PlantUML diagrams for files: ${puml_files[*]}"
          plantuml -tpng "${puml_files[@]}"
          png_files=(*.png)
          if [ ${#png_files[@]} -eq 0 ]; then
            echo "Error: No PNG diagrams were generated by PlantUML." >&2
            exit 1
          fi
        working-directory: ./doc/figures/plantuml/

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            project-brief.tex
            report.tex
            january-deliverable.tex
          working_directory: ./doc/

      - name: Upload LaTeX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: latex-artifacts
          path: |
            doc/report.pdf
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download redacted artifact
        uses: actions/download-artifact@v4
        with:
          name: luggage-watch-report
          path: doc/report.pdf

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/report.pdf

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
